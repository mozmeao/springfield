name: Unit tests
on:
  push:
    branches:
      - 'main'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-js:
    name: JS tests
    runs-on: ubuntu-latest
    if: github.repository == 'mozmeao/springfield'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: "Install JS dependencies"
        run: npm ci
      - name: "Run JS tests"
        run: xvfb-run npm test

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    if: github.repository == 'mozmeao/springfield'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run Python tests (on Docker)"
        run: |
            make clean test-image
            CONTAINER_ID=$(docker ps -alq)
            docker cp $CONTAINER_ID:/app/python_coverage .
        timeout-minutes: 60
      - name: "Store coverage as an artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-results
          path: python_coverage
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          # A CodeCov token is normally NOT needed for public repos, but this workaround is suggested here:
          # https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954/18
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python_coverage/coverage.xml
          fail_ci_if_error: false  # optional (default = false)
          verbose: true  # optional (default = false)

  build-release-image:
    # `test-python` above already runs the full suite against the devapp image. This job only
    # proves the `release` Dockerfile target still builds (run-sync-all, then collectstatic under
    # the prod env), so it stops short of running the tests a second time.
    name: Release image builds
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}  # Only on PRs and Merge Queue prep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Build the release image (on Docker)"
        run: |
            make clean build-ci
        timeout-minutes: 30
