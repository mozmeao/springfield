# Runs the integration tests on every PR against a container built from the PR itself, so they
# catch problems before merge without needing a deployed environment. The post-merge runs against
# dev, stage and prod (integration_tests.yml) are unchanged, and still cover Sauce Labs.

name: PR integration tests
concurrency:
  # Only PR runs share a group, so a new push cancels the PR's previous run. Merge queue runs each
  # get their own group and always finish.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
run-name: "PR integration tests for ${{ github.head_ref || github.ref_name }}"
# No paths filter here: the job must always report so it can be a required check.
# The "Check for relevant changes" step skips the expensive steps when nothing relevant changed.
on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-integration-tests:
    name: PR integration tests
    if: github.repository == 'mozmeao/springfield'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skips the rest of the job when every changed file is in a path that can't change what the
      # site serves or how these tests run. Anything else, including a path added to the repo
      # later, runs the tests.
      - name: Check for relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          skip_paths='^(docs/|\.github/|tests/(unit|redirects)/|[^/]+\.md$|LICENSE$|license_header/)'
          this_workflow='^\.github/workflows/pr_integration_tests\.yml$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
          if grep -qvE "$skip_paths" <<< "$changed_files" || grep -qE "$this_workflow" <<< "$changed_files"; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, GitHub config or unrelated test files changed; skipping."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

      # The pulled images are the build cache (see docker-compose.yml); a failed pull only means
      # an uncached build. The release image already carries the app-base layers, so only the two
      # stages it copies from need their own images. bin/docker-compose.sh sets GIT_COMMIT and
      # APT_REFRESH_WEEK for the build.
      - name: Pull previous images to use as build cache
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          cp .env-dist .env
          GIT_COMMIT= docker compose pull --ignore-pull-failures release builder assets
      - name: Build the release image
        if: steps.changes.outputs.run_tests == 'true'
        run: bin/docker-compose.sh build release

      # Settings that differ from a deployed environment:
      # - The startup marker files are normally written by the supervisor's update jobs. The image
      #   already holds the database and translations from its build, so they only need to exist.
      # - GTM and stub attribution are on in deployed environments and the analytics and download
      #   attribution specs depend on them. Test traffic is marked with `automation=true`.
      # - WebKit upgrades http://localhost requests under `upgrade-insecure-requests`, so no
      #   scripts load over plain http without CSP_UPGRADE_INSECURE_REQUESTS=False.
      # - The referral key is the local-dev value from .env-dist.
      - name: Start the release container
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          docker run -d \
            --name springfield \
            -p 8000:8000 \
            -e DEBUG=False \
            -e DEV=False \
            -e ALLOWED_HOSTS='*' \
            -e GTM_CONTAINER_ID=GTM-527L9RBL \
            -e STUB_ATTRIBUTION_RATE=1 \
            -e CSP_UPGRADE_INSECURE_REQUESTS=False \
            -e REFERRAL_INVITE_CODE_KEY_V1=abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd \
            "mozmeao/springfield:$(git rev-parse HEAD)" \
            sh -c 'touch data/last-run-update_locales data/last-run-download_database && exec bin/run-prod.sh'
      - name: Wait for the server
        id: server
        if: steps.changes.outputs.run_tests == 'true'
        run: timeout 120 bash -c 'until curl -sf http://localhost:8000/healthz/; do sleep 2; done'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.run_tests == 'true'
        with:
          python-version: "3.13"
      - name: Cache uv downloads
        if: steps.changes.outputs.run_tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # As in integration_tests.yml: uv builds psycopg-c from source, which needs the libpq headers.
      - name: Install the psycopg build dependencies
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpq-dev
      - name: Install Python dependencies
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          pip install "uv==0.13.7"
          uv sync --locked
      # As in integration_tests.yml: Django settings import the CMS blocks, which scan this directory.
      - name: Provide the flare icon thumbnails
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          mkdir -p assets/img/firefox/flare
          cp -r media/img/firefox/flare/icons assets/img/firefox/flare/
      - name: Run headless tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          MARK_EXPRESSION: headless
          PYTEST_PROCESSES: 4
          REFERRAL_INVITE_CODE_KEY_V1: abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
        run: uv run --no-sync bin/integration_tests/run_integration_tests.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      # Browser cache keyed on the runner's distro release; see integration_tests.yml for why.
      - name: Record the runner image
        id: runner-image
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.runner-image.outputs.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
      - name: Install Playwright dependencies
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: cd tests/playwright && npm ci && npm run install-deps
      - name: Save Playwright browsers
        if: ${{ !cancelled() && steps.server.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: cd tests/playwright && npm run integration-tests

      - name: Show the server log
        if: ${{ failure() && steps.changes.outputs.run_tests == 'true' }}
        run: docker logs springfield 2>&1 | tail -200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.changes.outputs.run_tests == 'true' }}
        with:
          name: pr-integration-test-results-${{ github.run_id }}
          path: |
            tests/playwright/test-results/
            tests/results/
          if-no-files-found: ignore # this avoids a false "Warning" if there were no issues
          retention-days: 30
