# Workflows that run visual regression tests on Flare components

name: Visual regression tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
run-name: "Visual regression tests for ${{ github.head_ref || github.ref_name }}"
# No paths filter here: the job must always report so it can be a required check.
# The "Check for visual changes" step skips the expensive steps when nothing relevant changed.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression-tests:
    name: Visual regression tests
    if: github.repository == 'mozmeao/springfield'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for visual changes
        id: visual_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          visual_paths='^(springfield/cms/templates/components/|springfield/cms/templates/pattern-library/components/flare/|springfield/cms/templates/pattern-library/context-specific/|media/css/cms/|tests/playwright/specs/visual-regression/|tests/playwright/playwright\.config\.js$|tests/playwright/playwright\.visual-regression\.config\.js$|\.github/workflows/visual_regression_tests\.yml$)'
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
          if grep -qE "$visual_paths" <<< "$changed_files"; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No files affecting visual regression tests changed; skipping."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.visual_changes.outputs.run_tests == 'true'
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/playwright/package-lock.json
      - name: Cache Playwright browsers
        if: steps.visual_changes.outputs.run_tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
      - name: Install Playwright dependencies
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: cd tests/playwright && npm ci && npx playwright install --with-deps chromium
      - name: Build frontend assets
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: npm ci && npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.visual_changes.outputs.run_tests == 'true'
      - name: Build Docker image
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: |
          docker buildx build \
            --target devapp \
            --tag mozmeao/springfield_test:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .
      - name: Start Django server
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: |
          docker run -d \
            --name django-server \
            -p 8000:8000 \
            -e DEBUG=true \
            -e ENABLE_DJANGO_PATTERN_LIBRARY=true \
            -e ALLOWED_HOSTS='*' \
            -e WAGTAIL_ENABLE_ADMIN=True \
            -e REFERRAL_INVITE_CODE_KEY_V1=abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd \
            -v $GITHUB_WORKSPACE/assets:/app/assets:ro \
            mozmeao/springfield_test:latest \
            python manage.py runserver 0.0.0.0:8000
      - name: Wait for Django server
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz/; do sleep 2; done'
      - name: Run Playwright tests
        if: steps.visual_changes.outputs.run_tests == 'true'
        run: cd tests/playwright && npm run local:visual-regression-tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.visual_changes.outputs.run_tests == 'true' }}
        with:
          name: test-results-${{ github.sha }}-${{ github.run_id }}
          path: tests/playwright/test-results/
          if-no-files-found: ignore # this avoids a false "Warning" if there were no issues
          retention-days: 30
