# Workflows that run visual regression tests on Flare components

name: Visual regression tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
run-name: "Visual regression tests for ${{ github.head_ref || github.ref_name }}"
on:
  pull_request:
    branches:
      - main
    paths:
      - 'springfield/cms/templates/components/**'
      - 'springfield/cms/templates/pattern-library/components/flare/**'
      - 'media/css/cms/**'
      - 'tests/playwright/specs/visual-regression/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression-tests:
    name: "Visual regression tests for ${{ github.head_ref || github.ref_name }}"
    if: always() && github.repository == 'mozmeao/springfield'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/playwright/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
      - name: Install Playwright dependencies
        run: cd tests/playwright && npm ci && npx playwright install --with-deps chromium
      - name: Build frontend assets
        run: npm ci && npm run build
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Docker image
        run: |
          docker buildx build \
            --target devapp \
            --tag mozmeao/springfield_test:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .
      - name: Start Django server
        run: |
          docker run -d \
            --name django-server \
            -p 8000:8000 \
            -e DEBUG=true \
            -e ENABLE_DJANGO_PATTERN_LIBRARY=true \
            -e ALLOWED_HOSTS='*' \
            -e WAGTAIL_ENABLE_ADMIN=True \
            -e REFERRAL_INVITE_CODE_KEY_V1=abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd \
            -v $GITHUB_WORKSPACE/assets:/app/assets:ro \
            mozmeao/springfield_test:latest \
            python manage.py runserver 0.0.0.0:8000
      - name: Wait for Django server
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz/; do sleep 2; done'
      - name: Run Playwright tests
        run: cd tests/playwright && npm run local:visual-regression-tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.sha }}-${{ github.run_id }}
          path: tests/playwright/test-results/
          if-no-files-found: ignore # this avoids a false "Warning" if there were no issues
          retention-days: 30
