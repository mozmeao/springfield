name: Fluent Linter

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "l10n/en/**.ftl"
      - ".github/l10n/*"
      - ".github/workflows/fluent_linter.yml"
    branches:
      - main
  pull_request:
    paths:
      - "l10n/en/**.ftl"
      - ".github/l10n/*"
      - ".github/workflows/fluent_linter.yml"
    branches:
      - main
  workflow_dispatch:
jobs:
  linter:
    name: Lint Fluent files
    runs-on: ubuntu-latest
    if: github.repository == 'mozmeao/springfield'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          pip install -r .github/l10n/requirements.txt
      - name: Lint firefox.com files
        run: |
          moz-fluent-lint l10n/en --config .github/l10n/linter_config.yml
      - name: Check TOML files
        run: |
          python .github/l10n/check_toml_configs.py --path .
