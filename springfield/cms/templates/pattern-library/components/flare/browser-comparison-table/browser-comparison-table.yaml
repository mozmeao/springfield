name: Browser Comparison Table
context:
  # Header cells as a browser logo with a label, body cells as Yes/No/Limited results
  image_header_cells:
    - label: ""
    - url: /media/img/firefox/flare/placeholder.png
      label: Firefox
    - url: /media/img/firefox/flare/placeholder.png
      label: Other browsers
  result_rows:
    - label: Blocks trackers by default
      results:
        - icon_name: checkmark-circle-fill
          label: "Yes"
        - icon_name: close-circle-fill
          label: "No"
    - label: Works without an account
      results:
        - icon_name: checkmark-circle-fill
          label: "Yes"
        - icon_name: circle-semi-filled
          label: Limited
    - label: Sells your browsing data
      results:
        - icon_name: close-circle-fill
          label: "No"
        - icon_name: circle-semi-filled
          label: Limited
  fine_print: "* Comparison reflects default settings at the time of publication."
