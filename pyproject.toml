    "mozilla-django-oidc==5.0.2",
    "Pillow==12.3.0",
    "psycopg[c]==3.3.4",  # use version with psycopg_c support - also needs libpq-dev in the Docker image;     may need it for local dev, too
    "py-svg-hush==0.3.0",
    "PyGithub==2.10.0",
    "PyYAML==6.0.3",
    "qrcode==8.2",
    "requests==2.34.2",
    "sentry-processor==0.0.1",
    "sentry-sdk==2.69.2",
    "supervisor==4.3.0",
    "timeago==1.0.16",
    "wagtail-link-block==1.2",
    "wagtail-localize-dashboard==0.5.0",
    "wagtail-localize-intentional-blanks==0.3.0",
    "wagtail-localize-smartling==0.13.0",
    "wagtail-localize==1.14.5",
    "wagtail-thumbnail-choice-block==0.3.0",
    "Wagtail==7.4.3",
    "wagtaildraftsharing==0.3.0",
    "Wand==0.7.2",  # For animated GIF support
    "whitenoise==6.12.0",
    "django-pattern-library @ https://github.com/lincolnloop/django-pattern-library/releases/download/v1.5.3/django_pattern_library-1.5.3.tar.gz",
    "mdx_outline @ https://github.com/mozmeao/mdx_outline/archive/refs/tags/markdown-3.4-compatibility.tar.gz",
